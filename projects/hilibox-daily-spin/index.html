<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HiliBox 转盘独立演示</title><style>*{box-sizing:border-box}body{margin:0;background:#eee8ed;font:14px system-ui;color:#35213b}header{padding:12px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;background:#fff;position:relative}.back-project{position:absolute;left:16px;color:#35213b;text-decoration:none;font-size:13px;white-space:nowrap}.back-project:hover{text-decoration:underline}.back-project{display:none!important}@media(max-width:760px){.back-project{position:static;order:-1;width:100%;text-align:left}}select,button{padding:8px;border:1px solid #e5bfd0;border-radius:8px;background:#fff}button{background:#f7c1d5}p{text-align:center;margin:8px;font-size:12px}main{display:flex;justify-content:center;padding:24px 16px 36px;overflow:auto}.phone{flex:none;width:395px;height:832px;padding:10px;border-radius:38px;background:#352a38;box-shadow:0 16px 42px #35213b24}.phone iframe{display:block;width:375px;height:812px;margin:0;border:0;border-radius:29px;background:#fff}@media(max-width:420px){main{justify-content:flex-start;padding:16px 8px}}.phone.is-desktop{width:min(1280px,100%);height:max(850px,calc(100vh - 150px));padding:0;border:1px solid #ead7e2;border-radius:18px;background:#fff;overflow:hidden;box-shadow:0 12px 40px #35213b16}.phone.is-desktop iframe{width:100%;height:100%;border-radius:0}.phone.is-fluid{width:100%;max-width:395px;height:832px}.phone.is-fluid iframe{width:100%;height:812px}@media(max-width:420px){main{justify-content:center}.phone.is-fluid{padding:0;border-radius:0;box-shadow:none;background:transparent}}
.model-stage{position:relative;flex:none;width:395px;height:832px}.model-stage .phone.is-desktop{position:absolute;inset:0;width:1440px;height:1200px;padding:10px;border:0;border-radius:24px;background:#352a38;box-shadow:0 18px 50px #35213b28;transform-origin:top left}.phone.is-desktop iframe{width:1420px;height:1180px;border-radius:14px;background:#fff}.model-stage:has(.is-fluid){max-width:100%}
</style><header><b>独立演示</b><select id="viewport" aria-label="Preview device"><option value="mobile" selected>手机 375×812</option><option value="desktop">PC 预览</option><option value="auto">自动适配</option></select><select id="lang"><option value="en">English</option><option value="ar">العربية</option><option value="zh">中文</option></select><select id="scene"><option value="normal">正常抽奖</option><option value="gift">演示实物中奖</option><option value="multi_gift">多商品轮播</option><option value="gift_sold_out">实物售罄</option><option value="shared">分享网页</option><option value="failure">首次失败与重试</option></select><button id="reset">新一轮演示</button></header><p>仅本机模拟 · 不发真实优惠券/订单 · 美妆产品为原创示意素材 · 纯静态前端</p><main><div class="model-stage"><div class="phone" aria-label="375 × 812 手机演示模型"><iframe id="demo" title="HiliBox每日转盘演示"></iframe></div></div></main><script>
let demoStore;try{demoStore=localStorage;demoStore.setItem('__demo_check','1');demoStore.removeItem('__demo_check');}catch{let m={};demoStore={getItem:k=>m[k]||null,setItem:(k,v)=>m[k]=v,removeItem:k=>delete m[k]};}let session=Date.now().toString();const frame=document.querySelector('#demo'),lang=document.querySelector('#lang'),scene=document.querySelector('#scene');const viewport=document.querySelector('#viewport');let lastDesktop=null;function sizeModel(){const stage=document.querySelector('.model-stage'),model=document.querySelector('.phone');if(model.classList.contains('is-desktop')){const scale=Math.min(1,Math.max(280,innerWidth-48)/1440);stage.style.width=(1440*scale)+'px';stage.style.height=(1200*scale)+'px';model.style.transform='scale('+scale+')';model.setAttribute('aria-label','1440 × 1200 PC preview model');}else{stage.style.width=viewport.value==='mobile'?'395px':'min(395px, 100%)';stage.style.height='832px';model.style.transform='';model.setAttribute('aria-label','375 × 812 mobile preview model');}}function load(){const desktop=viewport.value==='desktop'||(viewport.value==='auto'&&innerWidth>=900);document.querySelector('.phone').classList.toggle('is-desktop',desktop);document.querySelector('.phone').classList.toggle('is-fluid',viewport.value==='auto'&&!desktop);lastDesktop=desktop;sizeModel();const p=new URLSearchParams({lang:lang.value,mockApi:'1',auth:'1',mockDelivered:'1',mockSession:session});p.set('layout',viewport.value==='mobile'?'mobile':desktop?'desktop':'auto');if(scene.value==='gift')p.set('mockPrize','gift');if(['multi_gift','gift_sold_out'].includes(scene.value))p.set('mockActivity',scene.value);if(scene.value==='shared'){p.set('shared','1');const token='standalone-share-'+session;const key='hilibox-spin-referrals-v1:daily-exclusive-preview';let ledger;try{ledger=JSON.parse(demoStore.getItem(key)||'null');}catch{}ledger=ledger||{tokens:{},devices:{},credits:{}};ledger.tokens[token]={owner:'demo-inviter',device:'demo-inviter-device'};demoStore.setItem(key,JSON.stringify(ledger));p.set('shareToken',token);}if(scene.value==='failure'){p.set('failDrawOnce','1');p.set('failClaimOnce','1');}frame.src='app/mobile.html?'+p;}viewport.onchange=load;let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{const next=viewport.value==='desktop'||(viewport.value==='auto'&&innerWidth>=900);if(viewport.value==='auto'&&next!==lastDesktop)load();else sizeModel();},180);});lang.onchange=load;scene.onchange=load;document.querySelector('#reset').onclick=()=>{for(const k of Object.keys(demoStore))if(k.startsWith('hilibox-spin-'))demoStore.removeItem(k);session=Date.now().toString();load();};load();</script></html>
